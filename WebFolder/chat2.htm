    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-main:       #ffffff;
        --bg-assistant:  #f5f5f5;
        --bg-user:       #f3f0fa;
        --bg-code:       #f0f0f0;
        --text-primary:  #222222;
        --accent:        #19c37d;
        --accent-text:   #000000;
        --avatar-user:   #bdb7e6;
        --border:        #dddddd;
        --scrollbar:     #cccccc;
        --radius:        12px;
        --font:          'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main:      #1e1e1e;
          --bg-assistant: #2a2a2a;
          --bg-user:      #33304a;
          --bg-code:      #2d2d2d;
          --text-primary: #e6e6e6;
          --accent:       #19c37d;
          --accent-text:  #0a0a0a;
          --avatar-user:  #6f68a8;
          --border:       #444444;
          --scrollbar:    #555555;
        }
      }

      body, html {
        background: var(--bg-main);
        color: var(--text-primary);
      }

      body {
        font-family: var(--font);
        background: var(--bg-main);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        overflow: hidden;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .bubble a { color: var(--accent); }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 0;
        scroll-behavior: smooth;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .message-row {
        display: flex;
        justify-content: center;
        padding: 6px 20px;
        width: 100%;
      }

      .message-wrap {
        width: 100%;
        max-width: 700px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        margin-top: 2px;
      }
      .avatar.user     { background: var(--avatar-user); color: var(--text-primary); }
      .avatar.assistant { background: var(--accent); color: var(--accent-text); }

      .bubble {
        flex: 1;
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 15px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user      { background: var(--bg-user); }
      .bubble.assistant { background: var(--bg-assistant); }

      .bubble code {
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        font-family: 'Cascadia Code', 'Fira Code', monospace;
        font-size: 13px;
      }
      .bubble pre {
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .bubble pre code { background: none; border: none; padding: 0; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    </style>

<body>

<div id="messages"></div>

<script>
const messagesEl = document.getElementById('messages');

/**
 * Ajoute un message utilisateur au chat
 * @param {string} message - Le message de l'utilisateur
 */
function addUserMessage(message) {
  appendBubble('user', message);
}

/**
 * Ajoute un message assistant au chat
 * @param {string} message - La réponse de l'assistant
 */
function addAssistantMessage(message) {
  appendBubble('assistant', message);
}

/**
 * Ajoute (append) du texte à la fin de la dernière bulle assistant,
 * au lieu de créer une nouvelle bulle. Utile pour le streaming token
 * par token. Si la dernière bulle n'est pas une bulle assistant (ou
 * qu'il n'y a pas encore de message), une nouvelle bulle est créée.
 * @param {string} chunk - Le fragment de texte à ajouter
 */
function appendAssistantMessage(chunk) {
  const rows = messagesEl.children;
  const lastRow = rows[rows.length - 1];
  const lastBubble = lastRow ? lastRow.querySelector('.bubble.assistant') : null;

  if (!lastBubble) {
    appendBubble('assistant', chunk);
    return;
  }

  // On garde le markdown brut accumulé pour re-parser l'ensemble à
  // chaque append (un ``` ou ** peut être coupé entre deux chunks).
  lastBubble._raw = (lastBubble._raw || '') + chunk;
  lastBubble.innerHTML = markdownToHtml(lastBubble._raw);

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/**
 * Affiche un message dans le chat
 * @param {string} role - 'user' ou 'assistant'
 * @param {string} content - Le contenu du message
 */
function appendBubble(role, content) {
  const row = document.createElement('div');
  row.className = 'message-row';

  const emoji = role === 'user' ? '👤' : '🤖';
  const html = role === 'assistant' ? markdownToHtml(content) : escapeHtml(content);

  row.innerHTML = `
    <div class="message-wrap">
      <div class="avatar ${role}">${emoji}</div>
      <div class="bubble ${role}">${html}</div>
    </div>`;

  const bubble = row.querySelector('.bubble');
  if (role === 'assistant') bubble._raw = content; // pour appendAssistantMessage

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

/**
 * Échappe les caractères HTML
 */
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/**
 * Convertit le Markdown basique en HTML
 */
function markdownToHtml(md) {
  let s = escapeHtml(md);
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trimEnd()}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  s = s.replace(/\n/g, '<br>');
  return s;
}
//addAssistantMessage("Please upload your file first.")
addAssistantMessage("ファイルをアップロードしてください")
</script>
</body>
