<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4D AI Upload file</title>
 <!-- ...existing code... -->
    <style>
      body, html {
        background: #fff !important;
        color: #222 !important;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-main:      #ffffff;
        --bg-assistant: #f5f5f5;
        --text-primary: #222222;
        --accent:       #19c37d;
        --border:       #dddddd;
        --radius:       12px;
        --font:         'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      body {
        font-family: var(--font);
        background: var(--bg-main);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        overflow: hidden;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 0;
        scroll-behavior: smooth;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .message-row {
        display: flex;
        justify-content: center;
        padding: 6px 20px;
        width: 100%;
      }

      .message-wrap {
        width: 100%;
        max-width: 700px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        margin-top: 2px;
      }
      .avatar.user     { background: #bdb7e6; color: #222; }
      .avatar.assistant { background: var(--accent); color: #000; }

      .bubble {
        flex: 1;
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 15px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user      { background: #f3f0fa; }
      .bubble.assistant { background: var(--bg-assistant); }

      .bubble code {
        background: #f0f0f0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        font-family: 'Cascadia Code', 'Fira Code', monospace;
        font-size: 13px;
      }
      .bubble pre {
        background: #f0f0f0;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .bubble pre code { background: none; border: none; padding: 0; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
<!-- ...existing code... -->
</head>
<body>

<div id="messages"></div>

<script>
const messagesEl = document.getElementById('messages');

/**
 * Ajoute un message utilisateur au chat
 * @param {string} message - Le message de l'utilisateur
 */
function addUserMessage(message) {
  appendBubble('user', message);
}

/**
 * Ajoute un message assistant au chat
 * @param {string} message - La réponse de l'assistant
 */
function addAssistantMessage(message) {
  appendBubble('assistant', message);
}

/**
 * Affiche un message dans le chat
 * @param {string} role - 'user' ou 'assistant'
 * @param {string} content - Le contenu du message
 */
function appendBubble(role, content) {
  const row = document.createElement('div');
  row.className = 'message-row';

  const emoji = role === 'user' ? '👤' : '🤖';
  const html = role === 'assistant' ? markdownToHtml(content) : escapeHtml(content);

  row.innerHTML = `
    <div class="message-wrap">
      <div class="avatar ${role}">${emoji}</div>
      <div class="bubble ${role}">${html}</div>
    </div>`;

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/**
 * Échappe les caractères HTML
 */
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/**
 * Convertit le Markdown basique en HTML
 */
function markdownToHtml(md) {
  let s = escapeHtml(md);
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trimEnd()}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  s = s.replace(/\n/g, '<br>');
  return s;
}
addAssistantMessage("Please upload your file first.")
</script>
</body>
</html>
